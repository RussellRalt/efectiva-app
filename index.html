<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Efectiva — Tu día, bajo control</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Efectiva" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="style.css?v=35" />
  <link rel="manifest" href="manifest.json" />
  <!-- Librería ligera para captura de elementos en imagen PNG HD -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
  <!-- SECCIÓN CARPETAS -->
  <section id="foldersSection">
    <header>
      <h1 class="app-brand"><span class="app-brand-mark">E</span><span>Efectiva</span><span id="appVersionBadge" class="app-version-pill">v35</span></h1>
    </header>

    <!-- Contenedor de íconos (tema, importar, papelera) -->
    <div class="top-icon-bar">
      <!-- Botón de tema -->
      <button id="themeButton" class="icon-button" title="Cambiar tema">🌙</button>

      <!-- Botón importar JSON -->
      <label for="importFileInput" class="icon-button" id="importJsonBtn" title="Importar JSON">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" width="18" height="18" fill="currentColor">
          <path d="M169.4 470.6c4.5 4.5 10.6 7.4 17 7.4s12.5-2.9 17-7.4l160-160c9.2-9.2 12-22.9 7-34.9s-16.6-19.4-29-19.4H272V64c0-17.7-14.3-32-32-32H144c-17.7 0-32 14.3-32 32V256H29.7c-12.4 0-23.5 7.6-28.5 19.4s-2.2 25.7 7 34.9l160 160z"/>
        </svg>
      </label>
      <input type="file" id="importFileInput" accept="application/json" style="display: none;" />

      <!-- Botón Centro de Control (Automatizaciones, Retrasos, Memoria IA) -->
      <button id="controlCenterBtn" class="icon-button" title="Centro de Control">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/>
          <line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/>
          <line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>
        </svg>
      </button>

      <!-- Botón de papelera -->
      <button id="trashButton" class="icon-button" title="Ver papelera">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" width="18" height="18" fill="currentColor">
          <path d="M160 400C160 408.8 152.8 416 144 416C135.2 416 128 408.8 128 400V240C128 231.2 135.2 224 144 224C152.8 224 160 231.2 160 240V400zM256 240C256 231.2 263.2 224 272 224C280.8 224 288 231.2 288 240V400C288 408.8 280.8 416 272 416C263.2 416 256 408.8 256 400V240zM0 80C0 62.33 14.33 48 32 48H80L96.38 34C103.2 27.12 112.3 23.1 121.9 23.1H326.1C335.7 23.1 344.8 27.12 351.6 34L368 48H416C433.7 48 448 62.33 448 80C448 97.67 433.7 112 416 112H32C14.33 112 0 97.67 0 80zM32.11 160H415.9C419.8 160 423.5 161.7 426.2 164.4C428.8 167.1 430.7 170.8 431 174.8L416 464C416 490.5 394.5 512 368 512H80C53.49 512 32 490.5 32 464L16.1 174.8C17.21 168.1 24.56 160 32.11 160z"/>
        </svg>
      </button>
    </div>

    <!-- Acceso rápido 1-clic: Empezar ahora -->
    <div id="quickStartContainer" class="quick-start-container" style="display: none;">
      <button id="quickStartPlayBtn" class="quick-start-btn" type="button">
        <span class="qs-icon">▶</span>
        <span class="qs-text">
          <strong id="quickStartTitle">Empezar ahora</strong>
          <small id="quickStartSub">Continuar tu rutina</small>
        </span>
      </button>
    </div>

    <!-- Input para crear carpeta con Enter -->
    <div class="new-folder">
      <input type="text" id="newFolderInput" class="new-folder-input" placeholder="Agrega una carpeta (Enter)..." />
    </div>

    <!-- Contenedor de carpetas -->
    <div class="folder-container" id="folderContainer">
      <!-- Carpetas generadas dinámicamente -->
    </div>
  </section>

  <!-- SECCIÓN TAREAS -->
  <section id="tasksSection" style="display: none;">
    <header class="section-header-with-back">
      <button id="backToFoldersBtn" class="header-back-btn" type="button" title="Volver a carpetas" aria-label="Volver a carpetas">←</button>
      <h2 id="tasksTitle">Carpeta</h2>
    </header>

    <div class="tasks-container">
      <!-- Selector Unificado de Modo de Creación (Tarea / Nota) -->
      <div class="creation-mode-toggle">
        <button id="modeTabTask" class="mode-tab active" type="button">☑ Tarea</button>
        <button id="modeTabNote" class="mode-tab" type="button">📝 Nota</button>
        <button id="modeTabTemplates" class="mode-tab" type="button" title="Mis plantillas guardadas">📌 Plantillas</button>
      </div>
      <div id="userTemplatesPanel" class="user-templates-panel" style="display: none;"></div>

      <!-- Contenedor Unificado de Creación -->
      <div id="unifiedCreationArea" class="unified-creation-area">
        <!-- Modo Tarea -->
        <div id="taskCreationForm" class="new-task">
          <input type="text" id="newTaskInput" placeholder="Agrega una tarea (Enter)..." />
          <input type="number" id="newTaskTimeInput" placeholder="Tiempo (min) (opcional)" min="0" />
        </div>

        <!-- Modo Nota -->
        <div id="noteCreationForm" class="new-note-form" style="display: none;">
          <input type="text" id="newNoteTitleInput" class="new-note-title" placeholder="Título de la nota..." autocomplete="off" />
          <textarea id="newNoteContentInput" class="new-note-content" rows="3" placeholder="Escribí el contenido de la nota aquí..."></textarea>
          <div class="new-note-actions">
            <button id="saveNewNoteBtn" class="save-note-btn" type="button">💾 Guardar Nota</button>
          </div>
        </div>
      </div>

      <!-- Listado Único Unificado de Elementos (Tareas y Notas) -->
      <h3 class="subheading">Tareas y Notas</h3>
      <div id="tasksList" class="tasks-list"></div>

      <!-- Mini Carpeta Fija para tareas finalizadas -->
      <div id="completedMiniFolder" class="mini-folder-container">
        <div class="mini-folder-icon" title="Tareas Finalizadas">📁</div>
        <div id="completedMiniFolderList" class="tasks-list"></div>
      </div>
    </div>
  </section>

  <!-- SECCIÓN PAPELERA -->
  <section id="trashSection" style="display: none;">
    <header class="section-header-with-back">
      <button id="backFromTrashBtn" class="header-back-btn" type="button" title="Volver a carpetas" aria-label="Volver a carpetas">←</button>
      <h2>Papelera</h2>
    </header>
    <div id="trashList" class="trash-list"></div>
  </section>

  <!-- MODAL DE PRESENTACIÓN (RECREACIÓN GRID BLINDADA v27) -->
  <div class="presentation-modal" id="presentationModal">
    <div class="presentation-content">
      <div class="presentation-header-bar">
        <div class="presentation-task-info">
          <span class="presentation-folder-tag" id="presentationFolderTag"></span>
          <h3 class="presentation-task-name" id="presentationTaskName"></h3>
        </div>
        <div class="presentation-window-actions">
          <button id="minimizePresentationBtn" class="audio-coach-btn minimize-btn" type="button" title="Minimizar presentación">🗕 Minimizar</button>
          <button id="closePresentationBtn" class="audio-coach-btn close-pres-btn" type="button" title="Cerrar presentación" aria-label="Cerrar">✖</button>
        </div>
      </div>

      <div class="presentation-toolbar presentation-header-actions">
        <button id="presentationLinkedNoteBtn" class="audio-coach-btn" type="button" style="display: none;" title="Ver nota vinculada a esta tarea">📝 Nota</button>
        <button id="presentationReplayVoiceBtn" class="audio-coach-btn replay-voice-btn" type="button" title="Volver a escuchar este paso">🔁 Repetir</button>
        <button id="presentationAudioCoachBtn" class="audio-coach-btn" type="button" title="Activar/Desactivar voz hablada Audio-Coach">📣 Voz ON</button>
      </div>

      <div id="presentationLinkedNoteDrawer" class="pres-note-drawer" style="display: none;"></div>

      <!-- Barra de progreso segmentada estilo TikTok / Stories -->
      <div class="presentation-progress-bar-container" id="presentationProgressContainer"></div>

      <div class="presentation-meta-row">
        <div class="presentation-step-counter" id="presentationStepCounter">Paso 1 de 1</div>
        <div class="presentation-scroll-badge" id="presentationScrollBadge" style="display: none;">↕ Deslizá dentro para leer</div>
      </div>

      <!-- Contenedor del paso con altura garantizada y mini-scroll para textos largos -->
      <div class="presentation-card-wrapper" id="presentationCardWrapper">
        <div class="presentation-step" id="presentationStep"></div>
      </div>

      <div class="presentation-bottom-bar">
        <div class="presentation-timer-row">
          <div class="timer" id="timerDisplay">00:00</div>
          <button id="justifyDelayBtn" class="justify-delay-btn" type="button" style="display: none;" title="Justificar retraso / añadir tiempo">📝 Justificar retraso</button>
        </div>
        <div id="delayJustifyBox" class="delay-justify-box" style="display: none;">
          <input id="delayReasonInput" type="text" placeholder="¿Por qué te atrasaste? (ej: Fui por jabón)" maxlength="140" />
          <div class="delay-justify-actions">
            <input id="delayExtraMinInput" type="number" min="0" step="1" placeholder="+ min (opcional)" title="Sumar minutos al paso (opcional)" />
            <button id="saveDelayBtn" type="button" class="delay-save-btn">Guardar</button>
            <button id="cancelDelayBtn" type="button" class="delay-cancel-btn">Cancelar</button>
          </div>
        </div>
        <div class="presentation-swipe-hint" id="presentationSwipeHint">
          <span class="hint-arrow">↕</span> Deslizá o tocá izq/der para navegar
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL DE ASIGNAR FECHA/HORA -->
  <div class="schedule-modal" id="scheduleModal">
    <div class="schedule-content">
      <h2>Agendar Tarea</h2>
      <label for="scheduleDateInput">Fecha y hora:</label>
      <input type="datetime-local" id="scheduleDateInput" />
      <div class="schedule-buttons">
        <button id="saveScheduleBtn">Guardar</button>
        <button id="cancelScheduleBtn">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- MODAL DE ALARMA -->
  <div class="alarm-modal" id="alarmModal">
    <div class="alarm-content">
      <h2 id="alarmTitle">¡Es hora de tu tarea!</h2>
      <button id="disableAlarmBtn">Desactivar</button>
    </div>
  </div>

  <!-- SECCIÓN RECOMPENSA -->
  <!-- (La sección de recompensa con input ya no se usa. Las recompensas se crean/editan dentro de la carpeta "Recompensas") -->
  <section id="rewardSection" style="display: none;">
    <header>
      <h2>Registra tu Recompensa</h2>
    </header>
    <div class="reward-container">
      <input type="text" id="rewardInput" placeholder="Describe tu recompensa y presiona Enter..." />
    </div>
  </section>

  <!-- MODAL DE MOVER TAREA -->
  <div class="move-modal" id="moveModal">
    <div class="move-content">
      <h2>Mover Tarea</h2>
      <label for="targetFolderSelect">Selecciona carpeta de destino:</label>
      <select id="targetFolderSelect"></select>
      <div class="move-buttons">
        <button id="confirmMoveBtn">Mover</button>
        <button id="cancelMoveBtn">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- MODAL DE CONFIRMACIÓN PERSONALIZADO -->
  <div class="confirm-modal" id="confirmModal" style="display: none;">
    <div class="confirm-content">
      <p id="confirmMessage">¿Estás seguro?</p>
      <div class="confirm-buttons">
        <button id="confirmYesBtn">Sí</button>
        <button id="confirmNoBtn">No</button>
      </div>
    </div>
  </div>

  <!-- MODAL CENTRO DE CONTROL (ESTILO APPLE) -->
  <div id="controlCenterModal" class="cc-modal" style="display: none;">
    <div class="cc-card">
      <div class="cc-header">
        <div class="cc-title-group">
          <span class="cc-kicker">Efectiva OS</span>
          <h2 class="cc-title">Centro de Control</h2>
        </div>
        <button id="closeControlCenterBtn" class="cc-close-btn" type="button" aria-label="Cerrar">✕</button>
      </div>
      <div class="cc-segmented" role="tablist">
        <button class="cc-seg-btn active" data-cc-tab="rules" type="button">⚡ Reglas</button>
        <button class="cc-seg-btn" data-cc-tab="delays" type="button">📊 Retrasos</button>
        <button class="cc-seg-btn" data-cc-tab="memory" type="button">🧠 Memoria IA</button>
      </div>
      <div id="controlCenterBody" class="cc-body"></div>
    </div>
  </div>

  <!-- CHAT IA FLOTANTE v3 (Diseño moderno) -->
  <button id="aiFab" class="ai-fab" title="Asistente IA" aria-label="Abrir Asistente IA">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3l1.9 4.7L18.5 9.5l-4.6 1.8L12 16l-1.9-4.7L5.5 9.5l4.6-1.8L12 3z" fill="currentColor" fill-opacity="0.18"/>
      <path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15z"/>
      <path d="M5 17l.6 1.4L7 19l-1.4.6L5 21l-.6-1.4L3 19l1.4-.6L5 17z"/>
    </svg>
  </button>
  <div id="aiPanel" class="ai-panel" style="display: none;">
    <div class="ai-header">
      <button id="aiSidebarToggle" class="ai-icon-btn" title="Mostrar / ocultar panel" aria-label="Panel lateral">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="ai-header-brand">
        <span class="ai-status-dot"></span>
        <span id="aiChatTitle" class="ai-chat-title" title="Click para renombrar">Nuevo chat</span>
      </div>
      <button id="aiSettingsBtn" class="ai-icon-btn" title="Configurar API key de IA" aria-label="Configurar IA">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button id="aiCloseBtn" class="ai-icon-btn" title="Minimizar chat (sigue trabajando)" aria-label="Minimizar chat">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
    <div class="ai-body">
      <aside id="aiSidebar" class="ai-sidebar">
        <div class="ai-tabs">
          <button class="ai-tab active" data-tab="history" title="Historial">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </button>
          <button class="ai-tab" data-tab="skills" title="Skills">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          </button>
        </div>
        <div class="ai-tab-content" data-tab="history">
          <button id="aiNewChatBtn" class="ai-new-btn" title="Nuevo chat">+ Nuevo chat</button>
          <div id="aiHistoryList" class="ai-list"></div>
        </div>
        <div class="ai-tab-content hidden" data-tab="skills">
          <button id="aiNewSkillBtn" class="ai-new-btn" title="Nuevo skill">+ Nuevo skill</button>
          <div id="aiSkillsList" class="ai-list"></div>
        </div>
      </aside>
      <main class="ai-main">
        <div id="aiMessages" class="ai-messages"></div>
        <div class="ai-input-row">
          <button id="aiUnifiedVoiceBtn" class="ai-unified-voice-btn" title="Activar/Desactivar Modo Hablado Manos Libres Continuo">🎙️</button>
          <textarea id="aiInput" rows="1" placeholder="Hablá o escribí un mensaje..." autocomplete="off"></textarea>
          <button id="aiSendBtn" class="ai-send" title="Enviar mensaje" aria-label="Enviar">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </main>
    </div>
  </div>

  <!-- MODAL CREAR/EDITAR SKILL -->
  <div id="aiSkillModal" class="ai-modal" style="display: none;">
    <div class="ai-modal-content">
      <h3 id="aiSkillModalTitle">Nuevo skill</h3>
      <label>Nombre</label>
      <input id="aiSkillName" type="text" placeholder="Ej: Planificar el día" maxlength="40" />
      <label>Ícono (un emoji)</label>
      <input id="aiSkillIcon" type="text" placeholder="⚡" maxlength="2" />
      <label>Prompt (lo que se le envía al asistente)</label>
      <textarea id="aiSkillPrompt" rows="4" placeholder="Ej: Armame un plan para mañana con mis tareas pendientes, ordenado por prioridad."></textarea>
      <div class="ai-modal-buttons">
        <button id="aiSkillCancelBtn" class="ai-modal-cancel">Cancelar</button>
        <button id="aiSkillSaveBtn" class="ai-modal-save">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Supabase: registro, inicio de sesión y sincronización segura -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js?v=35"></script>
  <!-- Sistema de modales temáticos (DEBE cargarse antes que el resto) -->
  <script src="modals.js?v=35"></script>
  <!-- Motor financiero estructurado multi-moneda (GTQ/USD en centavos) -->
  <script src="finance.js?v=35"></script>
  <!-- Script principal -->
  <script src="script.js?v=35"></script>
  <script src="ai_chat.js?v=35"></script>
  <script>
    if ('serviceWorker' in navigator) {
      const isCapacitorNative = !!(window.EfectivaAndroidBridge || (window.Capacitor && typeof window.Capacitor.isNativePlatform === 'function' && window.Capacitor.isNativePlatform()));
      if (isCapacitorNative) {
        // En APK nativa Capacitor, desregistrar cualquier SW viejo para que nunca interfiera con el puente nativo ni sirva caché vieja
        navigator.serviceWorker.getRegistrations().then(regs => {
          regs.forEach(r => r.unregister().catch(() => {}));
        }).catch(() => {});
        if ('caches' in window) {
          caches.keys().then(keys => keys.forEach(k => caches.delete(k).catch(() => {}))).catch(() => {});
        }
      } else {
        let swReloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (swReloading) return;
          swReloading = true;
          window.location.reload();
        });
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(reg => {
            reg.update().catch(() => {});
          }).catch(() => {});
        });
      }
    }
  </script>
  <script>
    document.querySelectorAll('.restore-btn').forEach(button => {
        button.addEventListener('click', function() {
            restoreTask(this);
        });
    });

    function restoreTask(button) {
        console.log('Tarea restaurada');
    }
  </script>
</body>
</html>
